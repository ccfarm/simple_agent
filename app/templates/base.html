<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · 个人 A 股投资助手</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/stocks">A 股投资助手</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link {% if active == 'stocks' %}active{% endif %}" href="/stocks">股票列表</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active == 'chat' %}active{% endif %}" href="/chat">AI 问答</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active == 'settings' %}active{% endif %}" href="/settings">设置</a>
          </li>
        </ul>
        {% if user %}
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <span class="navbar-text me-3">{{ user.username }}</span>
          </li>
          <li class="nav-item">
            <form method="post" action="/logout" class="d-inline">
              <button type="submit" class="btn btn-outline-light btn-sm">退出</button>
            </form>
          </li>
        </ul>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
