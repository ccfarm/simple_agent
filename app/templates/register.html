<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · 个人 A 股投资助手</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-light">
  <main class="container" style="max-width: 420px;">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h4 class="card-title mb-4 text-center">注册</h4>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" action="/register">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" name="username" class="form-control" value="{{ username | default('') }}" autofocus>
            <div class="form-text">2-32 个字符</div>
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control">
            <div class="form-text">至少 6 位</div>
          </div>
          <div class="mb-3">
            <label class="form-label">确认密码</label>
            <input type="password" name="password2" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary w-100">注册</button>
        </form>
        <p class="text-center mt-3 mb-0">
          已有账号？<a href="/login">去登录</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>
